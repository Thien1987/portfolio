name: Build and deploy portfolio to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI Project Dashboard/package-lock.json

      - name: Install Margin dependencies
        working-directory: AI Project Dashboard
        run: npm ci

      - name: Build Margin prototype
        working-directory: AI Project Dashboard
        run: npm run build

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html script.js styles.css "Hero forest.png" "Profile portrait upright.png" _site/
          cp -R Portfolio AirScout WorkPal _site/
          mkdir -p "_site/AI Project Dashboard"
          cp -R "AI Project Dashboard/dist" "_site/AI Project Dashboard/"
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
